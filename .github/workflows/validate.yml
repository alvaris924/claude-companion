name: Validate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Require a Conventional Commit title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            perf
            test
            build
            revert
          scopes: |
            capture
            suggest
            ui
            settings
            commands
            tests
            docs
            ci
            release
            deps
          ignoreLabels: |
            dependencies
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter and read as an imperative sentence,
            for example "feat(suggest): offer a fourth choice when the answer ends in a question".
