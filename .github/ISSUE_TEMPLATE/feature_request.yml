name: Feature request
description: Propose a feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Sketches of the band or the panel are welcome; leave out anything private.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap fit
      description: Where you think this belongs. Maintainers make the final call.
      options:
        - "Phase 1 - First public release (v0.9.0)"
        - "Phase 2 - Stable (v1.0.0)"
        - "Later"
        - "Not sure"
